name: Council meetings
on:
  schedule:
    - cron: "15 6,13 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python council/fetch_meetings.py
      - name: Commit if changed
        run: |
          git config user.name "deeside-bot"
          git config user.email "actions@users.noreply.github.com"
          git add council/meetings.json
          git diff --cached --quiet || (git commit -m "Council meetings update" && git push)
