<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming up at Flintshire County Council</title>
<script>window.__d=fetch('meetings.json?t='+Math.floor(Date.now()/1800000)).then(function(r){return r.json()});</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="../house.css?v=4">
<style>
ul { list-style: none; }
li a { display: flex; gap: 12px; align-items: flex-start; padding: 10px 14px; border-bottom: 1px solid var(--rule); }
.d { flex: 0 0 44px; text-align: center; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; }
.d b { display: block; font-size: 18px; font-weight: 800; color: var(--head); line-height: 1.2; padding-top: 2px; }
.d small { display: block; font-size: 10px; font-weight: 700; text-transform: uppercase; background: var(--green); color: #fff; padding: 1px 0; }
.c { font-size: 14.5px; font-weight: 700; color: var(--head); line-height: 1.3; }
.m { font-size: 12px; color: var(--muted); margin-top: 2px; }
.tag { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 3px; margin-left: 4px; }
.tag.live { background: #e8f2d6; color: var(--green-dk); }
.tag.sp { background: var(--amber-bg); color: var(--amber); }
li a:hover .c { text-decoration: underline; }
.card-ft a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="card" id="w">
  <div class="card-hd"><h3>Coming up at the council</h3><span class="upd">Flintshire</span></div>
  <div class="load" id="body">Loading…</div>
</div>
<script>
var N = Math.min(12, parseInt(new URLSearchParams(location.search).get('n'), 10) || 6);
var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
var day = function (iso, o) { return new Date(iso + 'T12:00:00Z').toLocaleDateString('en-GB', Object.assign({timeZone: 'Europe/London'}, o)); };
window.__d.then(function (d) {
  var today = new Date().toISOString().slice(0, 10);
  var items = (d.meetings || []).filter(function (m) { return m.date >= today; }).slice(0, N);
  if (!items.length) { document.getElementById('body').textContent = 'No meetings scheduled in the next few weeks.'; return; }
  document.getElementById('body').outerHTML = '<ul>' + items.map(function (m) {
    return '<li><a href="' + esc(m.url) + '" target="_blank" rel="noopener">' +
      '<span class="d"><small>' + day(m.date, {month: 'short'}) + '</small><b>' + day(m.date, {day: 'numeric'}) + '</b></span>' +
      '<span><span class="c">' + esc(m.committee) + '</span>' +
      '<span class="m">' + day(m.date, {weekday: 'long'}) + (m.time ? ', ' + esc(m.time) : '') +
      (m.webcast ? '<span class="tag live">Webcast</span>' : '') + (m.special ? '<span class="tag sp">Special meeting</span>' : '') +
      '</span></span></a></li>';
  }).join('') + '</ul>' +
  '<div class="card-ft"><a href="https://committeemeetings.flintshire.gov.uk/mgCalendarMonthView.aspx" target="_blank" rel="noopener">Full council calendar</a><small>Tap a meeting for its papers</small></div>';
}).catch(function () { document.getElementById('body').textContent = 'Meeting dates are unavailable right now.'; });
</script>
<script>
(function () {
  var el = document.getElementById('w'), key = 'council';
  function post() { try { parent.postMessage({deesideWidget: key, height: Math.ceil(el.getBoundingClientRect().height) + 6}, '*'); } catch (e) {} }
  if (window.ResizeObserver) new ResizeObserver(post).observe(el);
  addEventListener('load', post); addEventListener('resize', post);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(post);
  setTimeout(post, 1500); setTimeout(post, 4000);
})();
</script>
</body>
</html>
