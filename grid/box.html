<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The grid right now</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="../house.css?v=4">
<style>
/* In-article box for power and grid stories (9 Nov 2026). Same data as the Power and the grid page. */
body { background: transparent; margin: 0; }
#wrap { max-width: 760px; margin: 0; padding: 0; }
.box { border: 1px solid var(--rule); border-top: 4px solid var(--green); background: #fff; }
.hd { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 12px 14px 0; }
.hd h2 { font-size: 18px; font-weight: 800; color: var(--head); margin: 0; }
.hd .t { font-size: 12.5px; color: var(--muted); }
.status { margin: 10px 14px 0; padding: 9px 12px; font-size: 14.5px; line-height: 1.45; border-left: 5px solid var(--green); background: #f4f9f1; color: var(--head); }
.status b { display: block; font-size: 15px; }
.status.amber { border-color: #f59e0b; background: var(--amber-bg); }
.status.red { border-color: var(--red); background: var(--red-bg); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin: 12px 14px 0; border: 1px solid var(--rule); border-right: 0; }
.s { padding: 9px 11px; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); margin-bottom: -1px; }
.s .lbl { font-size: 12px; font-weight: 700; color: var(--muted); }
.s .v { font-size: 23px; font-weight: 800; color: var(--head); letter-spacing: -.6px; line-height: 1.15; margin-top: 2px; }
.s .v span { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
.s .d { font-size: 12px; color: var(--muted); line-height: 1.35; margin-top: 2px; }
.units { display: flex; gap: 3px; margin-top: 6px; }
.units i { flex: 1; height: 7px; background: #edf0f2; }
.units i.on { background: #9aa0a6; }
.hzrow { margin: 12px 14px 0; }
.hzrow .top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); }
.hzrow .top b { font-size: 19px; font-weight: 800; color: var(--head); }
.hzbar { position: relative; height: 14px; margin: 7px 0 3px; background: linear-gradient(90deg, #f3c9c9 0%, #fbe7c6 20%, #dcefc4 40%, #dcefc4 60%, #fbe7c6 80%, #f3c9c9 100%); }
.hzbar i { position: absolute; top: -3px; bottom: -3px; width: 3px; margin-left: -1.5px; background: var(--head); }
.hzticks { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
.ft { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; padding: 10px 14px; border-top: 1px solid var(--rule); font-size: 12px; color: var(--muted); }
.ft a { font-size: 14px; font-weight: 700; color: var(--green-dk, #3a5c09); text-decoration: none; }
.ft a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div id="wrap"><div class="box">
  <div class="hd"><h2>The grid right now</h2><span class="t" id="upd">Loading the live figures...</span></div>
  <div class="status" id="status" hidden></div>
  <div class="stats" id="stats"></div>
  <div class="hzrow" id="freq"></div>
  <div class="ft"><span>Live data: NESO and Elexon BMRS. Updates every five minutes.</span><a href="https://www.deeside.com/power-and-the-grid/" target="_top">Full live page: Power and the grid</a></div>
</div></div>
<script>
const L = 'https://65-109-143-26.sslip.io/live/';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const TZ = {timeZone: 'Europe/London'};
const tm = t => new Date(t).toLocaleTimeString('en-GB', {...TZ, hour: '2-digit', minute: '2-digit'});
const dy = (t, o) => new Date(t).toLocaleDateString('en-GB', {...TZ, ...o});
const gw = mw => (mw / 1000).toFixed(1);
const resize = () => { try { parent.postMessage({deesideWidget: 'grid-box', height: document.getElementById('wrap').offsetHeight + 4}, '*'); } catch (e) {} };

function load() {
  const t = Math.floor(Date.now() / 120000);
  Promise.all(['gridpage', 'grid', 'energy'].map(n => fetch(L + n + '.json?t=' + t).then(r => r.json()).catch(() => null)))
    .then(([gp, gr, en]) => {
      if (!gp) { document.getElementById('upd').textContent = 'Live figures not available just now.'; resize(); return; }
      document.getElementById('upd').textContent = `At ${tm(gp.at)}, ${dy(gp.at, {weekday: 'long', day: 'numeric', month: 'long'})}`;

      // status: only shown when something is in force, so the box stays quiet on normal days
      const st = document.getElementById('status'), active = (gr && gr.active) || [];
      if (active.some(a => a.kind === 'demand')) {
        st.className = 'status red'; st.hidden = false;
        st.innerHTML = `<b>National Grid has warned of possible power cuts</b>${esc(active.find(a => a.kind === 'demand').plain)}`;
      } else if (active.length) {
        st.className = 'status amber'; st.hidden = false;
        st.innerHTML = `<b>The grid is tighter than usual</b>${active.map(a => esc(a.plain)).join(' ')} No power cuts are expected.`;
      } else {
        st.className = 'status'; st.hidden = false;
        st.innerHTML = '<b>No National Grid warnings in force</b>The grid has enough spare power right now.';
      }

      const share = f => (gp.mix.find(m => m.fuel === f) || {perc: 0}).perc;
      const net = gp.imports_mw;
      const cnq = en && en.stations ? en.stations.find(s => s.id === 'cnq') : null;
      const wind = en && en.stations ? en.stations.filter(s => s.kind === 'wind') : [];
      const wmw = wind.reduce((a, s) => a + (s.mw || 0), 0), wcap = wind.reduce((a, s) => a + (s.capacity || 0), 0);
      const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
      document.getElementById('stats').innerHTML = `
        <div class="s"><div class="lbl">Britain: from wind</div><div class="v">${share('wind') < 1 ? '&lt;1' : Math.round(share('wind'))}<span>%</span></div><div class="d">Gas ${Math.round(share('gas'))}%, nuclear ${Math.round(share('nuclear'))}%</div></div>
        <div class="s"><div class="lbl">Britain is ${net >= 0 ? 'importing' : 'exporting'}</div><div class="v">${gw(Math.abs(net))}<span> GW</span></div><div class="d">${net >= 0 ? 'Net flow in through the undersea cables' : 'Selling more abroad than it is buying'}</div></div>
        ${cnq && !cnq.missing ? `<div class="s"><div class="lbl">Connah's Quay power station</div><div class="v">${Math.round(cnq.mw)}<span> MW</span></div><div class="units">${Array.from({length: cnq.units}, (_, i) => `<i class="${i < cnq.units_running ? 'on' : ''}"></i>`).join('')}</div><div class="d">${cnq.units_running} of ${cnq.units} turbines, ${pct(cnq.mw, cnq.capacity)}% of full power</div></div>` : ''}
        ${wind.length ? `<div class="s"><div class="lbl">Our offshore wind farms</div><div class="v">${Math.round(wmw)}<span> MW</span></div><div class="d">Gwynt y Môr and Burbo Bank, ${pct(wmw, wcap)}% of their ${wcap} MW capacity</div></div>` : ''}`;

      const F = gp.freq || [];
      if (F.length) {
        const hz = F[F.length - 1].hz, p = Math.max(0, Math.min(100, (hz - 49.5) * 100));
        const word = hz < 49.8 || hz > 50.2 ? 'outside its normal range' : Math.abs(hz - 50) < 0.05 ? 'right on target' : hz < 50 ? 'a touch low: a little more power used than made' : 'a touch high: a little more power made than used';
        document.getElementById('freq').innerHTML = `<div class="top"><span>Grid frequency</span><b>${hz.toFixed(3)} Hz</b><span>${word}</span></div>
          <div class="hzbar"><i style="left:${p}%"></i></div><div class="hzticks"><span>49.5</span><span>49.8</span><span>50.0</span><span>50.2</span><span>50.5</span></div>`;
      }
      resize();
    });
}
load();
setInterval(load, 300000);
window.addEventListener('resize', resize);
</script>
</body>
</html>
