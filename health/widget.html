<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A&amp;E waits: Wrexham Maelor and the Countess of Chester</title>
<!-- Health widget for deeside.com (front page Health section and the /health/ hub). 24 Nov 2026.
     Same data as the Maelor or the Countess? page: ae.json, refreshed on the server from StatsWales and NHS England. -->
<script>window.__a = fetch('https://65-109-143-26.sslip.io/live/ae.json?t=' + Math.floor(Date.now() / 3600000)).then(function (r) { return r.json(); });</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap"></noscript>
<link rel="stylesheet" href="../house.css?v=4">
<style>
:root { --wm: #c8102e; --coc: #005eb8; }
.hosp { padding: 12px 14px 12px; border-bottom: 1px solid var(--rule); border-left: 5px solid var(--c); }
.hosp h4 { font-size: 15px; font-weight: 800; color: var(--head); }
.hosp .where { font-size: 11.5px; color: var(--muted); }
.row { display: flex; align-items: baseline; gap: 8px; margin-top: 8px; }
.big { font-size: 30px; font-weight: 800; color: var(--head); letter-spacing: -1px; line-height: 1; min-width: 64px; }
.lbl { font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.3; }
.lbl small { display: block; font-size: 11.5px; font-weight: 400; color: var(--muted); }
.bar { height: 7px; background: #edf0f2; margin-top: 6px; } .bar i { display: block; height: 100%; background: var(--c); }
.l12 { margin-top: 8px; font-size: 13px; color: var(--ink); }
.l12 b { font-weight: 800; color: var(--head); }
.std { padding: 9px 14px; font-size: 12px; color: var(--muted); line-height: 1.4; }
.better { color: var(--green-dk); font-weight: 700; } .worse { color: var(--red); font-weight: 700; }
</style>
</head>
<body>
<a class="card" id="w" href="https://www.deeside.com/maelor-or-the-countess/" target="_top">
  <div class="card-hd"><h3>A&amp;E waits</h3><span class="upd" id="upd"></span></div>
  <div class="load" id="body">Loading…</div>
</a>
<script>
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const mon = m => { const [y, n] = m.split('-'); return MONTHS[+n - 1] + ' ' + y; };
const pct = v => v == null ? '–' : Math.round(v);
const num = v => Math.round(v).toLocaleString('en-GB');
// Change on the month before, in percentage points. For the 4-hour figure up is better; for 12 hours, down is better.
function ch(now, before, upGood) {
  if (now == null || before == null) return '';
  const d = Math.round(now) - Math.round(before);
  if (!d) return 'same as the month before';
  const good = upGood ? d > 0 : d < 0;
  return `<span class="${good ? 'better' : 'worse'}">${d > 0 ? 'up' : 'down'} ${Math.abs(d)} points</span> on the month before`;
}
function hosp(name, where, colour, m, p) {
  if (!m || m.in4 == null) return '';
  const n12 = m.n12 != null ? m.n12 : (m.over12 != null && m.att ? m.att * m.over12 / 100 : null);
  return `<div class="hosp" style="--c:${colour}">
    <h4>${name}</h4><div class="where">${where}</div>
    <div class="row"><div class="big">${pct(m.in4)}%</div><div class="lbl">seen within four hours<small>${ch(m.in4, p && p.in4, true)}</small></div></div>
    <div class="bar"><i style="width:${Math.max(0, Math.min(100, m.in4))}%"></i></div>
    ${m.over12 != null ? `<div class="l12"><b>${pct(m.over12)}%</b> waited 12 hours or more${n12 ? `, about ${num(n12)} people` : ''}${m.over12_status === 'Provisional' ? ' (provisional)' : ''}</div>` : ''}
  </div>`;
}
function render(d) {
  const ms = d.months || [];
  const L = ms[ms.length - 1], P = ms[ms.length - 2] || {};
  if (!L) throw new Error('no data');
  document.getElementById('upd').textContent = mon(L.month);
  const out = [];
  out.push(hosp('Wrexham Maelor', 'NHS Wales, Betsi Cadwaladr', 'var(--wm)', L.maelor, P.maelor));
  out.push(hosp('Countess of Chester', 'NHS England', 'var(--coc)', L.countess, P.countess));
  out.push('<div class="std">The standard in both countries is 95% within four hours.</div>');
  out.push('<div class="card-ft"><span>Maelor or the Countess? Compare A&amp;E waits</span><small>StatsWales, NHS England</small></div>');
  document.getElementById('body').outerHTML = out.join('');
}
window.__a.then(render).catch(() => { document.getElementById('body').textContent = 'A&E figures are unavailable right now.'; });
</script>
<script>
/* Keep the frame on deeside.com exactly the right height, including after fonts load on phones */
(function () {
  var el = document.getElementById('w'), key = 'health';
  function post() { try { parent.postMessage({deesideWidget: key, height: Math.ceil(el.getBoundingClientRect().height) + 6}, '*'); } catch (e) {} }
  if (window.ResizeObserver) new ResizeObserver(post).observe(el);
  addEventListener('load', post); addEventListener('resize', post);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(post);
  setTimeout(post, 1500); setTimeout(post, 4000);
})();
</script>
</body>
</html>
