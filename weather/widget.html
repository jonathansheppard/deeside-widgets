<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deeside right now</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --bg: #0c0c0e; --rule: rgba(255,255,255,.07); --text: #f9fafb; --muted: #8b93a1; --dim: #4b5563;
  --green: #22c55e; --amber: #f59e0b; --red: #ef4444; --blue: #60a5fa; }
html, body { background: transparent; }
body { font-family: 'DM Sans', sans-serif; color: var(--text); }
a { color: inherit; text-decoration: none; }
.w { background: var(--bg); border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,.06);
  box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 8px 32px rgba(0,0,0,.6); display: block; }
.hd { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px 8px; border-bottom: 1px solid var(--rule); }
.brand { font-weight: 600; font-size: 11px; letter-spacing: .8px; text-transform: uppercase; }
.brand small { display: block; font-size: 9.5px; font-weight: 400; letter-spacing: .2px; color: var(--muted); text-transform: none; margin-top: 1px; }
.live { display: flex; align-items: center; gap: 5px; font-size: 9px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: var(--green); }
.pip { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); animation: pip 2.4s ease-in-out infinite; }
@keyframes pip { 50% { opacity: .35; box-shadow: none; } }
.alert { display: flex; gap: 8px; align-items: flex-start; padding: 8px 14px; font-size: 11.5px; font-weight: 600; line-height: 1.3; }
.alert small { display: block; font-weight: 400; font-size: 10px; opacity: .8; margin-top: 1px; }
.alert.red { background: rgba(239,68,68,.16); color: #fecaca; border-bottom: 1px solid rgba(239,68,68,.3); }
.alert.amber { background: rgba(245,158,11,.14); color: #fde68a; border-bottom: 1px solid rgba(245,158,11,.28); }
.alert .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 4px; flex: none; }
.alert.red .dot { background: var(--red); } .alert.amber .dot { background: var(--amber); }
.more { font-size: 10px; color: var(--muted); padding: 4px 14px 0; }
.clear { padding: 7px 14px; font-size: 10.5px; color: var(--green); border-bottom: 1px solid var(--rule); }
.now { display: flex; align-items: center; gap: 12px; padding: 12px 14px 8px; }
.temp { font-family: 'Bebas Neue', sans-serif; font-size: 60px; line-height: .9; }
.temp sup { font-size: 24px; vertical-align: top; margin-left: 1px; opacity: .7; }
.cond { font-size: 13px; font-weight: 600; }
.cond small { display: block; font-weight: 400; font-size: 10.5px; color: var(--muted); margin-top: 2px; line-height: 1.35; }
.hours { display: grid; grid-template-columns: repeat(4, 1fr); padding: 4px 8px 10px; border-bottom: 1px solid var(--rule); }
.h { text-align: center; font-size: 10px; color: var(--muted); }
.h svg { display: block; margin: 2px auto 1px; }
.h b { display: block; color: var(--text); font-size: 13px; font-weight: 600; }
.h .r { color: var(--blue); font-size: 9.5px; }
.tide { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; font-size: 11px; color: var(--muted); border-bottom: 1px solid var(--rule); }
.tide b { color: var(--text); font-weight: 600; }
.ft { display: flex; justify-content: space-between; align-items: center; padding: 9px 14px; background: rgba(96,165,250,.08); font-size: 11px; font-weight: 600; color: var(--blue); }
.ft span { font-size: 9px; font-weight: 400; color: var(--dim); }
.load { padding: 40px 14px; text-align: center; color: var(--muted); font-size: 11px; }
</style>
</head>
<body>
<a class="w" id="w" href="https://www.deeside.com/deeside-right-now/" target="_top">
  <div class="hd"><div class="brand">Deeside right now<small>Weather, warnings, tides and power</small></div><div class="live"><span class="pip"></span>Live</div></div>
  <div class="load" id="body">Loading the latest…</div>
</a>
<script src="common.js?v=3"></script>
<script>
function render(d) {
  const a = alerts(d), f = d.forecast, out = [];
  if (a.length) {
    a.slice(0, 2).forEach(x => out.push(`<div class="alert ${x.lvl}"><span class="dot"></span><div>${esc(x.text)}${x.sub ? `<small>${esc(x.sub)}</small>` : ''}</div></div>`));
    if (a.length > 2) out.push(`<div class="more">+${a.length - 2} more on the full page</div>`);
  } else {
    out.push('<div class="clear">No weather warnings, flood alerts or power cuts for Deeside</div>');
  }
  const hs = upcoming(f);
  if (hs.length) {
    const n = hs[0];
    out.push(`<div class="now">${icon(n.code, 50)}<div class="temp">${n.temp}<sup>°C</sup></div>
      <div class="cond">${esc(n.wx)}<small>Feels like ${n.feels}°. Wind ${n.wind}mph, gusts ${n.gust}mph</small></div></div>`);
    const picks = [3, 6, 9, 12].map(i => hs[i]).filter(Boolean);
    out.push('<div class="hours">' + picks.map(h => `<div class="h">${fmtHour(h.time)}${icon(h.code, 26)}<b>${h.temp}°</b><span class="r">${h.rain ?? 0}% rain</span></div>`).join('') + '</div>');
  }
  const hi = nextTide(d, 'High');
  if (hi) out.push(`<div class="tide"><span>Next high tide, Connah's Quay</span><span><b>${fmtTime(hi.time)}</b> ${dayName(hi.time) === 'Today' ? '' : dayLabel(hi.time)}${hi.height ? ` · ${hi.height.toFixed(1)}m` : ''}</span></div>`);
  out.push('<div class="ft">Full forecast, tides and disruption →<span>Met Office · NRW · UKHO</span></div>');
  document.getElementById('body').outerHTML = out.join('');
  size();
}
function size() { try { parent.postMessage({deesideWidget: 'weather', height: document.getElementById('w').offsetHeight + 2}, '*'); } catch (e) {} }
addEventListener('resize', size);
fetch(DATA + '?t=' + Math.floor(Date.now() / 300000)).then(r => r.json()).then(render)
  .catch(() => { document.getElementById('body').textContent = 'Weather is unavailable right now.'; });
</script>
</body>
</html>
